server {
    listen 80;
    server_name localhost www.redol.top redol.top;

    # ACME 验证路径
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 文件上传大小限制（200MB，支持FLAC）
    client_max_body_size 200M;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' http://backend:3000 https:; API from http://backend:3000;" always;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}

# HTTPS 配置
server {
    listen 443 ssl;
    server_name www.redol.top redol.top;

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # ACME 验证路径
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 文件上传大小限制（200MB，支持FLAC）
    client_max_body_size 200M;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
